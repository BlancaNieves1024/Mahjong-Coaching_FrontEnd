<!-- index.html の中身 -->
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>麻雀 AI牌譜添削ツール（仮）</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); width: 100%; max-width: 480px; text-align: center; }
        input[type="text"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; margin-bottom: 20px; }
        button { width: 100%; padding: 14px; background-color: #2ecc71; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #27ae60; }
    </style>
</head>
<body>
<div class="container">
    <h1>麻雀 AI牌譜添削ツール（仮）</h1>
    <p>※雀魂・天鳳の牌譜URLに対応</p>
    
    <!-- /analyze へ POST 送信することで画面が切り替わる -->
    <form action="/analyze" method="POST">
        <input type="text" name="url" placeholder="https://... 牌譜URLを入力" required>
        <button type="submit">解析を開始する</button>
    </form>
</div>
</body>
</html>
